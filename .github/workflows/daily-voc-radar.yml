name: Daily SmartThings VOC Pain Point Radar

on:
  schedule:
    # 22:30 UTC = 07:30 KST (UTC+9), every day.
    # NOTE: GitHub only fires `schedule` events for the workflow file that
    # lives on the repository's default branch. This will not run on a
    # schedule until this workflow is merged into the default branch.
    - cron: '30 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: voc-radar
  cancel-in-progress: false

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crawler/package-lock.json

      - name: Install dependencies
        working-directory: crawler
        run: npm install

      - name: Run self-test (fail fast if pipeline logic is broken)
        working-directory: crawler
        run: npm test

      - name: Collect VOC from all sources
        working-directory: crawler
        run: npm run collect

      - name: Analyze and generate report
        working-directory: crawler
        run: npm run analyze

      - name: Commit and push updated data + report
        run: |
          git config user.name "voc-radar-bot"
          git config user.email "actions@github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily SmartThings VOC Pain Point Radar $(date -u +%F)"
            git push
          fi

      - name: Set report date
        run: echo "REPORT_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Email the report
        # Only runs once MAIL_USERNAME / MAIL_PASSWORD / MAIL_TO repo secrets
        # are set (Settings -> Secrets and variables -> Actions). Until then
        # this step is skipped rather than failing the whole run.
        if: ${{ env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != '' && env.MAIL_TO != '' }}
        uses: dawidd6/action-send-mail@v3
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: SmartThings VOC Radar <${{ secrets.MAIL_USERNAME }}>
          subject: "SmartThings Pain Point Radar - ${{ env.REPORT_DATE }}"
          html_body: file://reports/latest.md
          convert_markdown: true
          content_type: text/html
